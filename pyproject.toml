[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rqrv"
version = "3.6.4"
description = "The Ultimate Bug Host Hunter Tool"
readme = "README.md"
authors = [{ name = "Ravan" }]
license = { text = "MIT" }
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "rich",
    "requests",
    "urllib3",
    "ipaddress",
    "httpx[http2]",
    "ipwhois",
]

[project.scripts]
rqrv = "rqrv.main:main"

[tool.setuptools]
packages = ["rqrv"]
include-package-data = true
