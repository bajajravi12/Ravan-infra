[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rqrv"
version = "3.5.1"
description = "The Ultimate Bug Host Hunter Tool"
readme = "README.md"
authors = [{ name = "Ravan" }]
dependencies = [
    "rich",
    "requests",
    "urllib3",
    "ipaddress",
    "httpx[http2]",
    "ipwhois",
]

[project.scripts]
rqrv = "rqrv.main:main"
